# Publish the static game files to Neocities after pushes to main.
name: Deploy to Neocities

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neocities-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site files
        uses: actions/checkout@v4

      - name: Upload site to Neocities
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          if [ -z "$NEOCITIES_API_KEY" ]; then
            echo "Add NEOCITIES_API_KEY in the repository's Actions secrets."
            exit 1
          fi

          deploy_dir="$(mktemp -d)"
          sed 's#\.\./backend/app\.js#./app.js#' frontend/index.html > "$deploy_dir/index.html"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $NEOCITIES_API_KEY" \
            -F "index.html=@$deploy_dir/index.html" \
            -F "game.css=@frontend/game.css" \
            -F "app.js=@backend/app.js" \
            -F "game.js=@backend/game.js" \
            -F "face-tracking.js=@backend/face-tracking.js" \
            -F "hand-tracking.js=@backend/hand-tracking.js" \
            -F "pose-tracking.js=@backend/pose-tracking.js" \
            https://neocities.org/api/upload