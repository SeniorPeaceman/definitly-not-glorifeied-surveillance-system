name: Deploy to Neocities

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neocities-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site files
        uses: actions/checkout@v4

      - name: Add deployment version to module URLs
        env:
          DEPLOY_VERSION: ${{ github.sha }}
        run: |
          sed -i "s#./app.js#./app.js?v=$DEPLOY_VERSION#" index.html
          sed -i "s#./face-tracking.js#./face-tracking.js?v=$DEPLOY_VERSION#" app.js
          sed -i "s#./hand-tracking.js#./hand-tracking.js?v=$DEPLOY_VERSION#" app.js
          sed -i "s#./pose-tracking.js#./pose-tracking.js?v=$DEPLOY_VERSION#" app.js

      - name: Upload site to Neocities
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          if [ -z "$NEOCITIES_API_KEY" ]; then
            echo "Add NEOCITIES_API_KEY in the repository's Actions secrets."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $NEOCITIES_API_KEY" \
            -F "index.html=@index.html" \
            -F "app.js=@app.js" \
            -F "face-tracking.js=@face-tracking.js" \
            -F "hand-tracking.js=@hand-tracking.js" \
            -F "pose-tracking.js=@pose-tracking.js" \
            https://neocities.org/api/upload