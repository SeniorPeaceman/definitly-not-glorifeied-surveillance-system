<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>definitly not glorified surveillance system</title>
    <!-- Keep only the video-feed rules; all other elements use browser defaults. -->
    <link rel="stylesheet" href="./game.css">
    <!-- Start the game after the document is available. -->
    <script type="module" src="../backend/app.js"></script>
  </head>
  <body>
    <h1>hello florian</h1>
    <main>

      <!-- Camera controls and live detector counts. -->
      <section>
        <div id="camera-stage">
          <video id="camera" autoplay muted playsinline webkit-playsinline></video>
          <canvas id="tracking-overlay" aria-label="Live face, hand, and pose tracking overlay"></canvas>
        </div>
        <p>
          <button id="start-button" type="button">Start camera</button>
          <button id="stop-button" type="button" disabled>Stop camera</button>
        </p>
        <p>Faces: <output id="face-count">0</output></p>
        <p>Hands: <output id="hand-count">0</output></p>
        <p>Poses: <output id="pose-count">0</output></p>
      </section>

      <!-- Show the current scoreboard and remove its persistent browser copy. -->
      <section>
        <h3>Scores</h3>
        <ol id="score-list" aria-label="Player and unassigned point totals"></ol>
        <button id="delete-saved-data-button" type="button">Delete saved data</button>
      </section>

      <!-- Each slider ID is read by game.js as the score for its matching cue. -->
      <section>
        <h2>Points per cue</h2>
        <p><label for="points-fist">Fist</label> <input id="points-fist" type="range" min="0" max="10" step="1" value="2"> <output id="points-fist-value" for="points-fist">+2</output></p>
        <p><label for="points-raised-fist">Raised fist</label> <input id="points-raised-fist" type="range" min="0" max="10" step="1" value="3"> <output id="points-raised-fist-value" for="points-raised-fist">+3</output></p>
        <p><label for="points-middle-finger">Middle finger</label> <input id="points-middle-finger" type="range" min="0" max="10" step="1" value="5"> <output id="points-middle-finger-value" for="points-middle-finger">+5</output></p>
        <p><label for="points-open-mouth">Open mouth</label> <input id="points-open-mouth" type="range" min="0" max="10" step="1" value="1"> <output id="points-open-mouth-value" for="points-open-mouth">+1</output></p>
        <p><label for="points-lowered-brows">Lowered brows</label> <input id="points-lowered-brows" type="range" min="0" max="10" step="1" value="1"> <output id="points-lowered-brows-value" for="points-lowered-brows">+1</output></p>
        <p><label for="points-both-arms-raised">Both arms raised</label> <input id="points-both-arms-raised" type="range" min="0" max="10" step="1" value="2"> <output id="points-both-arms-raised-value" for="points-both-arms-raised">+2</output></p>
        <p><label for="points-arms-spread">Arms spread</label> <input id="points-arms-spread" type="range" min="0" max="10" step="1" value="2"> <output id="points-arms-spread-value" for="points-arms-spread">+2</output></p>
      </section>
    </main>
  </body>
</html>
